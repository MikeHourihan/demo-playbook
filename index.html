<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Moved — The Ageless Call, Interactive Playbook</title>
<link rel="icon" href="favicon.svg">
<style>
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;max-width:560px;
       margin:18vh auto;padding:0 24px;color:#4A5653;line-height:1.65;background:#F6F6F3}
  h1{color:#1A2422;font-size:19px;margin:0 0 12px;line-height:1.4}
  a{color:#0E5A4A}
  .small{font-size:13px;color:#77817E;margin-top:22px}
</style>
<script>
/* This site holds no content any more. The playbook lives in Jarvis, behind Google sign-in.
   Deep links are preserved: an old #stage-3 bookmark becomes ?go=stage-3, which Jarvis carries
   through the sign-in round trip (a #fragment cannot survive it, a query parameter can).
   location.replace is used so this page does not sit in the back history. */
(function () {
  var BASE = 'https://jarvis-gray-three.vercel.app/ageless/playbook';
  var dest = BASE;
  try {
    var hash = (window.location.hash || '').replace(/^#/, '');
    /* Same shape Jarvis's ?go= accepts. Anything else is dropped and we send them to the top of
       the page rather than forwarding a value that would be ignored anyway. */
    if (hash && /^[A-Za-z0-9_-]{1,100}$/.test(hash)) {
      dest = BASE + '?go=' + encodeURIComponent(hash);
    }
  } catch (e) {
    /* any surprise: fall back to the plain page */
  }
  window.location.replace(dest);
})();
</script>
</head>
<body>
<h1>This playbook has moved.</h1>
<p>The Ageless Call, Interactive Playbook now lives in Jarvis, behind your RepeatMD Google sign-in.
You should be redirected automatically.</p>
<p><a href="https://jarvis-gray-three.vercel.app/ageless/playbook">Open the playbook in Jarvis &rarr;</a></p>
<p class="small">If that link asks you to sign in, use your @repeatmd.com Google account.</p>
</body>
</html>
